[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-portfolio-backend"
version = "0.1.0"
description = "Architecture portfolio API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.36,<1",
    "pydantic>=2.9,<3",
    "email-validator>=2.2,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0.22,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
    "boto3>=1.36,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "boto3-stubs[s3]>=1.36,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires TEST_DATABASE_URL or MIGRATION_TEST_ADMIN_URL for PostgreSQL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", ".pytest_tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "alembic"]
strict = true
plugins = ["pydantic.mypy"]
